name: Build latest Unigram

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Windows architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - ARM64

permissions:
  contents: read

jobs:
  build:
    name: Build Unigram
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout latest Unigram
        uses: actions/checkout@v5
        with:
          repository: UnigramDev/Unigram
          ref: develop
          submodules: recursive
          fetch-depth: 1

      - name: Find MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe was not found"
          }

          $vs = & $vswhere `
              -latest `
              -prerelease `
              -products * `
              -requires Microsoft.Component.MSBuild `
              -property installationPath

          if (-not $vs) {
              throw "Visual Studio with MSBuild was not found"
          }

          $msbuildDir = Join-Path $vs "MSBuild\Current\Bin\amd64"
          $msbuildExe = Join-Path $msbuildDir "MSBuild.exe"

          if (-not (Test-Path $msbuildExe)) {
              throw "MSBuild.exe was not found at $msbuildExe"
          }

          $msbuildDir |
              Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append

          Write-Host "Visual Studio:"
          Write-Host $vs

          Write-Host ""
          Write-Host "MSBuild:"
          Write-Host $msbuildExe

      - name: Check required build tools
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild.exe -version

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild check failed"
          }

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          if ($LASTEXITCODE -ne 0) {
              throw "CMake check failed"
          }

          Write-Host ""
          Write-Host "PHP:"
          php --version

          if ($LASTEXITCODE -ne 0) {
              throw "PHP check failed"
          }

      - name: Check Telegram credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_ID)) {
              throw "Repository secret TELEGRAM_API_ID is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_HASH)) {
              throw "Repository secret TELEGRAM_API_HASH is missing"
          }

          if ($env:TELEGRAM_API_ID -notmatch '^\d+$') {
              throw "TELEGRAM_API_ID must contain digits only"
          }

          if ($env:TELEGRAM_API_HASH -notmatch '^[0-9a-fA-F]+$') {
              throw "TELEGRAM_API_HASH must contain hexadecimal characters only"
          }

          Write-Host "Telegram credentials are present"

      - name: Create Constants.Secret.cs
        shell: pwsh
        run: |
          $file = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = $env:TELEGRAM_API_ID;
                      ApiHash = "$env:TELEGRAM_API_HASH";
                      AppChannel = "";
                  }
              }
          }
          "@

          Set-Content `
              -Path "Telegram\Constants.Secret.cs" `
              -Value $file `
              -Encoding UTF8

          if (-not (Test-Path "Telegram\Constants.Secret.cs")) {
              throw "Telegram\Constants.Secret.cs was not created"
          }

          Write-Host "Telegram\Constants.Secret.cs created"

      - name: Prepare matching vcpkg
        shell: pwsh
        run: |
          $manifestPath = Join-Path $PWD "vcpkg.json"

          if (-not (Test-Path $manifestPath)) {
              throw "vcpkg.json was not found"
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
              throw "builtin-baseline was not found in vcpkg.json"
          }

          Write-Host "Unigram vcpkg baseline:"
          Write-Host $baseline

          $vcpkgPath = "C:\unigram-vcpkg"

          if (Test-Path $vcpkgPath) {
              Remove-Item `
                  -Path $vcpkgPath `
                  -Recurse `
                  -Force
          }

          git clone https://github.com/microsoft/vcpkg.git $vcpkgPath

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to clone vcpkg"
          }

          Push-Location $vcpkgPath

          try {
              git checkout $baseline

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to checkout vcpkg baseline $baseline"
              }

              .\bootstrap-vcpkg.bat -disableMetrics

              if ($LASTEXITCODE -ne 0) {
                  throw "vcpkg bootstrap failed"
              }
          }
          finally {
              Pop-Location
          }

          $vcpkgExe = Join-Path $vcpkgPath "vcpkg.exe"

          if (-not (Test-Path $vcpkgExe)) {
              throw "vcpkg.exe was not created"
          }

          "VCPKG_ROOT=$vcpkgPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host "VCPKG_ROOT:"
          Write-Host $vcpkgPath

          Write-Host ""
          Write-Host "vcpkg version:"
          & $vcpkgExe version

          if ($LASTEXITCODE -ne 0) {
              throw "vcpkg version check failed"
          }

      - name: Install gperf
        shell: pwsh
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"

          if (-not (Test-Path $vcpkgExe)) {
              throw "vcpkg.exe was not found at $vcpkgExe"
          }

          Write-Host "Installing gperf:x86-windows in classic mode..."

          Push-Location $env:VCPKG_ROOT

          try {
              & $vcpkgExe install gperf:x86-windows --classic

              if ($LASTEXITCODE -ne 0) {
                  throw "gperf installation failed"
              }
          }
          finally {
              Pop-Location
          }

          $gperfDir = Join-Path `
              $env:VCPKG_ROOT `
              "installed\x86-windows\tools\gperf"

          $gperfExe = Join-Path $gperfDir "gperf.exe"

          if (-not (Test-Path $gperfExe)) {
              Write-Host "Searching for gperf.exe under vcpkg..."

              $found = Get-ChildItem `
                  -Path $env:VCPKG_ROOT `
                  -Filter "gperf.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

              if (-not $found) {
                  throw "gperf.exe was not found after installation"
              }

              $gperfExe = $found.FullName
              $gperfDir = $found.DirectoryName
          }

          $gperfDir |
              Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append

          $env:Path = "$gperfDir;$env:Path"

          Write-Host "gperf path:"
          Write-Host $gperfExe

          Write-Host ""
          Write-Host "gperf version:"
          & $gperfExe --version

          if ($LASTEXITCODE -ne 0) {
              throw "gperf execution failed"
          }

      - name: Verify gperf is available
        shell: pwsh
        run: |
          $gperf = Get-Command gperf.exe -ErrorAction SilentlyContinue

          if (-not $gperf) {
              throw "gperf.exe is not available on PATH"
          }

          Write-Host "gperf found at:"
          Write-Host $gperf.Source

          & $gperf.Source --version

          if ($LASTEXITCODE -ne 0) {
              throw "gperf verification failed"
          }

      - name: Build TDLib
        shell: powershell
        run: |
          Set-Location "Libraries\tdjson"

          .\build.ps1 -arch "${{ inputs.architecture }}"

          if ($LASTEXITCODE -ne 0) {
              throw "TDLib build failed with exit code $LASTEXITCODE"
          }

      - name: Verify TDLib output
        shell: pwsh
        run: |
          $arch = "${{ inputs.architecture }}"
          $tdDir = Join-Path "Libraries\tdjson" $arch

          if (-not (Test-Path $tdDir)) {
              throw "TDLib output directory was not found: $tdDir"
          }

          Write-Host "TDLib output:"
          Get-ChildItem `
              -Path $tdDir `
              -Recurse `
              -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize

          $tdjson = Get-ChildItem `
              -Path $tdDir `
              -Filter "tdjson.dll" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $tdjson) {
              throw "tdjson.dll was not found"
          }

      - name: Build Unigram MSIX
        shell: powershell
        run: |
          .\Build.ps1 `
              -arch "${{ inputs.architecture }}" `
              -mode "SideloadOnly"

          if ($LASTEXITCODE -ne 0) {
              throw "Unigram build failed with exit code $LASTEXITCODE"
          }

      - name: Show generated packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem `
              -Path . `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Extension -in @(
                      ".msixbundle",
                      ".msix",
                      ".appxbundle",
                      ".appx",
                      ".cer"
                  ) -or $_.Name -eq "Add-AppDevPackage.ps1"
              }

          if (-not $packages) {
              throw "No MSIX/AppX installation files were found"
          }

          Write-Host "Generated installation files:"

          $packages |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Collect installation files
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "build-artifact"

          if (Test-Path $artifactDir) {
              Remove-Item `
                  -Path $artifactDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifactDir `
              -Force |
              Out-Null

          $packageDirs = Get-ChildItem `
              -Path . `
              -Recurse `
              -Directory `
              -Filter "AppPackages" `
              -ErrorAction SilentlyContinue

          if ($packageDirs) {
              foreach ($dir in $packageDirs) {
                  Write-Host "Copying AppPackages directory:"
                  Write-Host $dir.FullName

                  Copy-Item `
                      -Path (Join-Path $dir.FullName "*") `
                      -Destination $artifactDir `
                      -Recurse `
                      -Force
              }
          }
          else {
              Write-Host "No AppPackages directory found. Collecting package files directly."

              $files = Get-ChildItem `
                  -Path . `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.Extension -in @(
                          ".msixbundle",
                          ".msix",
                          ".appxbundle",
                          ".appx",
                          ".cer"
                      ) -or $_.Name -eq "Add-AppDevPackage.ps1"
                  }

              if (-not $files) {
                  throw "No installation files could be collected"
              }

              foreach ($file in $files) {
                  Copy-Item `
                      -LiteralPath $file.FullName `
                      -Destination $artifactDir `
                      -Force
              }
          }

          $artifactFiles = Get-ChildItem `
              -Path $artifactDir `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $artifactFiles) {
              throw "Artifact directory is empty"
          }

          Write-Host ""
          Write-Host "Artifact contents:"

          $artifactFiles |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Upload Unigram package
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-${{ inputs.architecture }}
          path: build-artifact/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
