name: Build latest Unigram

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Windows architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - ARM64

permissions:
  contents: read

jobs:
  build:
    name: Build Unigram
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      # ------------------------------------------------------------
      # 1. Source code
      # ------------------------------------------------------------

      - name: Checkout latest Unigram
        uses: actions/checkout@v5
        with:
          repository: UnigramDev/Unigram
          ref: develop
          submodules: recursive

          # IMPORTANT:
          # UpdateManifest.ps1 uses:
          #
          #   git rev-list --count HEAD
          #
          # A shallow checkout would always give a tiny/incorrect
          # build number such as 1.
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Visual Studio / MSBuild
      # ------------------------------------------------------------

      - name: Find Visual Studio and MSBuild
        shell: pwsh
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir "vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe was not found at $vswhere"
          }

          $vs = & $vswhere `
              -latest `
              -prerelease `
              -products * `
              -requires Microsoft.Component.MSBuild `
              -property installationPath

          if ([string]::IsNullOrWhiteSpace($vs)) {
              throw "Visual Studio with MSBuild was not found"
          }

          $msbuildDir = Join-Path $vs "MSBuild\Current\Bin\amd64"
          $msbuildExe = Join-Path $msbuildDir "MSBuild.exe"

          if (-not (Test-Path $msbuildExe)) {
              throw "MSBuild.exe was not found at $msbuildExe"
          }

          # Some build tools may themselves need vswhere.
          $installerDir |
              Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append

          $msbuildDir |
              Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append

          Write-Host "Visual Studio:"
          Write-Host $vs

          Write-Host ""
          Write-Host "MSBuild:"
          Write-Host $msbuildExe

      - name: Check build tools
        shell: pwsh
        run: |
          Write-Host "=== MSBuild ==="
          msbuild.exe -version

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild check failed"
          }

          Write-Host ""
          Write-Host "=== CMake ==="
          cmake --version

          if ($LASTEXITCODE -ne 0) {
              throw "CMake check failed"
          }

          Write-Host ""
          Write-Host "=== PHP ==="
          php --version

          if ($LASTEXITCODE -ne 0) {
              throw "PHP check failed"
          }

          Write-Host ""
          Write-Host "=== Git ==="
          git --version

          if ($LASTEXITCODE -ne 0) {
              throw "Git check failed"
          }

      # ------------------------------------------------------------
      # 3. Telegram credentials
      # ------------------------------------------------------------

      - name: Check Telegram credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_ID)) {
              throw "Repository secret TELEGRAM_API_ID is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_HASH)) {
              throw "Repository secret TELEGRAM_API_HASH is missing"
          }

          if ($env:TELEGRAM_API_ID -notmatch '^\d+$') {
              throw "TELEGRAM_API_ID must contain digits only"
          }

          if ($env:TELEGRAM_API_HASH -notmatch '^[0-9a-fA-F]+$') {
              throw "TELEGRAM_API_HASH must contain hexadecimal characters only"
          }

          Write-Host "Telegram credentials are present"

      - name: Create Constants.Secret.cs
        shell: pwsh
        run: |
          $file = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = $env:TELEGRAM_API_ID;
                      ApiHash = "$env:TELEGRAM_API_HASH";

                      AppChannel = "";

                      // UpdateManifest.ps1 replaces this value
                      // with git rev-list --count HEAD.
                      BuildNumber = 0;
                  }
              }
          }
          "@

          Set-Content `
              -Path "Telegram\Constants.Secret.cs" `
              -Value $file `
              -Encoding UTF8

          if (-not (Test-Path "Telegram\Constants.Secret.cs")) {
              throw "Telegram\Constants.Secret.cs was not created"
          }

          Write-Host "Constants.Secret.cs created"

      # ------------------------------------------------------------
      # 4. vcpkg
      # ------------------------------------------------------------

      - name: Prepare matching vcpkg
        shell: pwsh
        run: |
          $manifestPath = Join-Path $PWD "vcpkg.json"

          if (-not (Test-Path $manifestPath)) {
              throw "vcpkg.json was not found"
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
              throw "builtin-baseline was not found in vcpkg.json"
          }

          Write-Host "Required vcpkg baseline:"
          Write-Host $baseline

          $vcpkgPath = "C:\unigram-vcpkg"

          if (Test-Path $vcpkgPath) {
              Remove-Item `
                  -Path $vcpkgPath `
                  -Recurse `
                  -Force
          }

          git clone https://github.com/microsoft/vcpkg.git $vcpkgPath

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to clone vcpkg"
          }

          Push-Location $vcpkgPath

          try {
              git checkout $baseline

              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to checkout vcpkg baseline $baseline"
              }

              .\bootstrap-vcpkg.bat -disableMetrics

              if ($LASTEXITCODE -ne 0) {
                  throw "vcpkg bootstrap failed"
              }
          }
          finally {
              Pop-Location
          }

          $vcpkgExe = Join-Path $vcpkgPath "vcpkg.exe"

          if (-not (Test-Path $vcpkgExe)) {
              throw "vcpkg.exe was not created"
          }

          "VCPKG_ROOT=$vcpkgPath" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "vcpkg:"
          & $vcpkgExe version

          if ($LASTEXITCODE -ne 0) {
              throw "vcpkg version check failed"
          }

      # ------------------------------------------------------------
      # 5. IMPORTANT: NuGet restore BEFORE TDLib
      #
      # Do this before the expensive native build. Otherwise a missing
      # project.assets.json is discovered only after TDLib has spent
      # tens of minutes compiling.
      # ------------------------------------------------------------

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $arch = "${{ inputs.architecture }}"

          Write-Host "Restoring solution packages for Release|$arch..."

          msbuild.exe Telegram.slnx `
              -restore `
              "-p:Configuration=Release" `
              "-p:Platform=$arch" `
              "-p:RestorePackagesConfig=true" `
              -nologo `
              -verbosity:minimal `
              -m

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Checking generated NuGet assets..."

          $stubAssets = "Telegram.Stub\obj\project.assets.json"

          if (-not (Test-Path $stubAssets)) {
              throw "NuGet restore succeeded but $stubAssets was not generated"
          }

          Write-Host "Found:"
          Write-Host (Resolve-Path $stubAssets)

      # ------------------------------------------------------------
      # 6. gperf
      # ------------------------------------------------------------

      - name: Install gperf
        shell: pwsh
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"

          if (-not (Test-Path $vcpkgExe)) {
              throw "vcpkg.exe was not found at $vcpkgExe"
          }

          Write-Host "Installing gperf:x86-windows in classic mode..."

          Push-Location $env:VCPKG_ROOT

          try {
              & $vcpkgExe install gperf:x86-windows --classic

              if ($LASTEXITCODE -ne 0) {
                  throw "gperf installation failed"
              }
          }
          finally {
              Pop-Location
          }

          $gperfDir = Join-Path `
              $env:VCPKG_ROOT `
              "installed\x86-windows\tools\gperf"

          $gperfExe = Join-Path $gperfDir "gperf.exe"

          if (-not (Test-Path $gperfExe)) {
              Write-Host "Expected gperf location was not found."
              Write-Host "Searching vcpkg tree..."

              $found = Get-ChildItem `
                  -Path $env:VCPKG_ROOT `
                  -Filter "gperf.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

              if (-not $found) {
                  throw "gperf.exe was not found after installation"
              }

              $gperfExe = $found.FullName
              $gperfDir = $found.DirectoryName
          }

          $gperfDir |
              Out-File `
                  -FilePath $env:GITHUB_PATH `
                  -Encoding utf8 `
                  -Append

          $env:Path = "$gperfDir;$env:Path"

          Write-Host ""
          Write-Host "gperf:"
          & $gperfExe --version

          if ($LASTEXITCODE -ne 0) {
              throw "gperf execution failed"
          }

      - name: Verify gperf on PATH
        shell: pwsh
        run: |
          $gperf = Get-Command gperf.exe -ErrorAction SilentlyContinue

          if (-not $gperf) {
              throw "gperf.exe is not available on PATH"
          }

          Write-Host "gperf.exe:"
          Write-Host $gperf.Source

      # ------------------------------------------------------------
      # 7. TDLib
      # ------------------------------------------------------------

      - name: Build TDLib
        shell: powershell
        run: |
          Set-Location "Libraries\tdjson"

          .\build.ps1 -arch "${{ inputs.architecture }}"

          if ($LASTEXITCODE -ne 0) {
              throw "TDLib build failed with exit code $LASTEXITCODE"
          }

      - name: Verify TDLib output
        shell: pwsh
        run: |
          $arch = "${{ inputs.architecture }}"
          $tdDir = Join-Path "Libraries\tdjson" $arch

          if (-not (Test-Path $tdDir)) {
              throw "TDLib output directory was not found: $tdDir"
          }

          $tdjson = Get-ChildItem `
              -Path $tdDir `
              -Filter "tdjson.dll" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $tdjson) {
              throw "tdjson.dll was not found after TDLib build"
          }

          Write-Host "TDLib:"
          Write-Host $tdjson.FullName

      # ------------------------------------------------------------
      # 8. Unigram
      # ------------------------------------------------------------

      - name: Build Unigram MSIX
        shell: powershell
        run: |
          .\Build.ps1 `
              -arch "${{ inputs.architecture }}" `
              -mode "SideloadOnly"

          if ($LASTEXITCODE -ne 0) {
              throw "Unigram build failed with exit code $LASTEXITCODE"
          }

      # ------------------------------------------------------------
      # 9. Artifact
      # ------------------------------------------------------------

      - name: Collect installation package
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "build-artifact"

          if (Test-Path $artifactDir) {
              Remove-Item `
                  -Path $artifactDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifactDir `
              -Force |
              Out-Null

          $packageDirs = Get-ChildItem `
              -Path . `
              -Directory `
              -Filter "AppPackages" `
              -Recurse `
              -ErrorAction SilentlyContinue

          if ($packageDirs) {
              foreach ($dir in $packageDirs) {
                  Write-Host "Copying:"
                  Write-Host $dir.FullName

                  Copy-Item `
                      -Path (Join-Path $dir.FullName "*") `
                      -Destination $artifactDir `
                      -Recurse `
                      -Force
              }
          }
          else {
              Write-Host "AppPackages directory not found."
              Write-Host "Searching package files directly..."

              $files = Get-ChildItem `
                  -Path . `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.Extension -in @(
                          ".msixbundle",
                          ".msix",
                          ".appxbundle",
                          ".appx",
                          ".cer"
                      ) -or $_.Name -eq "Add-AppDevPackage.ps1"
                  }

              if (-not $files) {
                  throw "No MSIX/AppX installation files were found"
              }

              foreach ($file in $files) {
                  Copy-Item `
                      -LiteralPath $file.FullName `
                      -Destination $artifactDir `
                      -Force
              }
          }

          $artifactFiles = Get-ChildItem `
              -Path $artifactDir `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $artifactFiles) {
              throw "Artifact directory is empty"
          }

          Write-Host ""
          Write-Host "Artifact contents:"

          $artifactFiles |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Upload Unigram package
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-${{ inputs.architecture }}
          path: build-artifact/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
